[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ims"
version = "1.0.0"
description = "Inventory and stock management system"
requires-python = ">=3.11"
dependencies = [
	"PySide6>=6.12",
	"google-api-python-client>=2.201.0",
	"google-auth>=2.61.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.21.0", "pyrefly>=1.3.2", "pytest>=9.1", "ruff>=0.16"]

[project.scripts]
ims = "ims.app:main"

[tool.setuptools.packages.find]
include = ["ims*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["E501"]

[tool.pylint.'MASTER']
init-hook = "import os, sys; sys.path.insert(0, os.getcwd())"

[tool.pylint.main]
disable = ["C0301"]
